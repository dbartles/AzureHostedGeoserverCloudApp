# This is a sample Nginx configuration file.
# In a production environment, this configuration would typically be placed
# in /etc/nginx/sites-available/default and a symbolic link would be created
# in /etc/nginx/sites-enabled/.

server {
    listen 80;
    listen [::]:80;

    # The root directory should point to the location of the built web application files.
    # The tutorial suggests copying the contents of the 'dist' folder to /data/www.
    root /data/www;

    # The default file to serve.
    index index.html;

    server_name _; # Respond to any server name

    location / {
        # First attempt to serve request as file, then
        # as directory, then fall back to displaying a 404.
        try_files $uri $uri/ =404;
    }
}
